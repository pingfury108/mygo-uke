[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chordd"
version = "0.1.0"
description = "Chord and downbeat analysis service for mygo-uke"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "python-multipart>=0.0.20,<0.1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
analysis = [
  "torch>=2.4,<3",
  "torchaudio>=2.4,<3",
  "librosa>=0.10,<0.12",
  "soundfile>=0.12,<0.14",
  "beat-this>=1.1,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["chordd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
